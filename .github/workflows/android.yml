name: PORAN LIVE Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build Android APK and AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses & Install Components
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "platform-tools" "platforms;android-35" "platforms;android-36" "build-tools;35.0.0" "build-tools;36.0.0" || true

      - name: Install dependencies
        run: npm install

      - name: Build web application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradle Wrapper Executable
        working-directory: android
        run: chmod +x gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Build Release APK
        working-directory: android
        run: ./gradlew assembleRelease --stacktrace || echo "Release APK requires keystore signing configuration."

      - name: Build Android App Bundle (AAB)
        working-directory: android
        run: ./gradlew bundleDebug --stacktrace && (./gradlew bundleRelease --stacktrace || echo "Release AAB unsigned fallback")

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PORAN-LIVE-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PORAN-LIVE-Release-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore

      - name: Upload Android App Bundle (AAB)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PORAN-LIVE-AAB
          path: android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: warn

      - name: Report Build Diagnostics on Failure
        if: failure()
        run: |
          echo "::error::Android Build failed. Checking Gradle logs..."
          find android/app/build -name "*.log" -exec cat {} + || true
